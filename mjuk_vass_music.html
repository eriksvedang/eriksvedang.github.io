<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">

    <link rel="stylesheet" type="text/css" href="/css/reset.css">
    <link rel="stylesheet" type="text/css" href="/css/base.css">
    <link rel="stylesheet" type="text/css" href="/css/mid.css" media="all and (min-width: 700px)">
    <link rel="stylesheet" type="text/css" href="/css/large.css" media="all and (min-width: 1200px)">

  <header>
    <title>Mjuk Vass music</title>
  </header>
  <body>
      <div class="content">

        <h1>Mjuk Vass</h1>

        <audio controls preload="metadata">
          <source src="/music/Reconing.mp3" type="audio/mpeg">
          Your browser doesn't support audio playback.
        </audio>

        <div class="odd">
          <figure>
            <figcaption>Reconing</figcaption>
            <audio controls src="/music/Reconing.mp3"></audio>
            <a href="/music/Reconing.mp3" download><img class="dl-icon" src="/img/download.png"></a>
          </figure>
        </div>

        <div class="even">
          <figure>
            <figcaption>Winter Drone</figcaption>
            <audio controls src="/music/Winter Drone.mp3"></audio>
            <a href="/music/Winter Drone.mp3" download><img class="dl-icon" src="/img/download.png"></a>
          </figure>
        </div>

      </div>
